services:
  app:
    image: nglzzz/twitch-bot:latest
    build:
      context: ./
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    container_name: nglzzz_twitch_bot.app
    environment:
      # Таймзона процесса внутри контейнера (иначе Docker по умолчанию = UTC).
      TZ: ${TZ:-Europe/Minsk}
    env_file: .env
    volumes:
      - dbdata:/app/data
    ports:
      - ${DOCKER_WEB_PORT:-80}:${WEB_PORT:-8080}
      - ${DOCKER_WEBSOCKET_PORT:-81}:${WEBSOCKET_PORT:-8081}
    networks:
      - nglzzz_twitch_bot

# SQLite: база хранится в файле внутри тома dbdata (примонтирован в /app/data).
# Путь задаётся переменной SQLITE_PATH (по умолчанию ./data/twitch-bot.sqlite).

networks:
  nglzzz_twitch_bot:
    name: nglzzz_twitch_bot
    driver: bridge

volumes:
  dbdata:
